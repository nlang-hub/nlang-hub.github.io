<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <h1 id="h1">Floating Color Palettes</h1>
        <div class="color-palette">
            <h2>Pink Flamingo</h2>
            <h4 class="color" id="color-1">#E8B4BC</h4>
            <h4 class="color" id="color-2">#D282A6</h4>
            <h4 class="color" id="color-3">#6E4555</h4>
        </div>
        <div class="color-palette">
            <h2>Ocean Breeze</h2>
            <h4 class="color" id="color-4">#FFE8D1</h4>
            <h4 class="color" id="color-5">#568EA3</h4>
            <h4 class="color" id="color-6">#68C3D4</h4>
        </div>
        <div class="color-palette">
            <h2>Forest</h2>
            <h4 class="color" id="color-7">#C7C7A6</h4>
            <h4 class="color" id="color-8">#A49966</h4>
            <h4 class="color" id="color-9">#605C4E</h4>
        </div>
    </body>
</html>
