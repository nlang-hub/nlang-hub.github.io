<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Widget Recreation 2</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="weather">
            <img id="sun"
                src="images/partly-sunny.svg"
                alt="weather"    
            >
            <p id="temp">81°</p>
            <p id="time">14:26</p>
            <p id="date">
                Wed 20 May <br>
                Seattle, WA
            </p>
        </div>
    </body>
</html>
