<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <div class="post-it">
                <div class="pushpin">
                    <div class="pushpin-top"></div>
                </div>
                <h2>Groceries</h2>
                <ul>
                    <li>Milk</li>
                    <li>Eggs</li>
                    <li>Butter</li>
                </ul>
            </div>
            <div class="post-it">
                <div class="pushpin">
                    <div class="pushpin-top"></div>
                </div>
                <h2>Motivation</h2>
                <p>"Difficult roads lead to beautiful destinations"</p>
            </div>
            <div class="post-it">
                <div class="pushpin">
                    <div class="pushpin-top"></div>
                </div>
                <h1>DISHES & LAUNDRY</h1>
            </div>
            <br>
            <div class="post-it">
                <div class="pushpin">
                    <div class="pushpin-top"></div>
                </div>
                <br>
                <img
                    src="images/seagull.png"
                    alt="gull"
                >
            </div>
            <div class="post-it">
                <div class="pushpin">
                    <div class="pushpin-top"></div>
                </div>
                <p>
                    "The successful man will profit from his mistakes and try 
                    again a different way"
                </p>
            </div>
            <div class="post-it">
                <div class="pushpin">
                    <div class="pushpin-top"></div>
                </div>
                <p>"Focus on the goal not the obstacle"</p>
            </div>
            
        </div>
    </body>
</html>
