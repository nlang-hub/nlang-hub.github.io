<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MeBay Product Page</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <!-- FLEXBOX CONTAINER -->
        <div id="layout">
            <!-- FLEXBOX ITEMS -->
            <div id="thumbnail-column">
                <img
                    src="images/s-l1600.jpg"
                    alt="funko1"
                >
                <img
                    src="images/s-l1600-2.jpg"
                    alt="funko2"
                >
                <img
                    src="images/s-l1600-3.jpg"
                    alt="funko3"
                >
            </div>

            <div id="featured-image-column">
                <img
                    src="images/s-l1600.jpg"
                    alt="funko"
                >
            </div>

            <div id="product-info-column">
                <h1>
                    Funko POP! 194 WWE Main Event Jey Uso Vinyl 
                    Figure + Protector New
                </h1>
                <hr>
                <div id="name-and-positive">
                    <a href="#" id="name">Sports Depot</a>
                    <a href="#" id="positive">(11249)</a>
                </div>
                <br>
                <a href="#">99.9% positive</a>
                <a href="#">Seller's other items</a>
                <a href="#">Contact seller</a>
                <hr>
                <h2>US $25.99</h2>
                <p>Condition: New</p>

                <div id="buttons">
                    <a href="#" id="buy">BUY IT NOW</a>
                    
                    <a href="#" id="cart">ADD TO CART</a>
            
                    <a href="#" id="wish">ADD TO WISHLIST</a>
                </div>


            </div>

        </div>
    </body>
</html>
