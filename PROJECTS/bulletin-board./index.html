<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board Project</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="bulletin-board">
            <div class="post-it">
                <p>"Life has no remote, get up and change it yourself"</p>
            </div>
            <div class="post-it">
                <p>"Difficult roads lead to beautiful destinations"</p>
            </div>
            <div class="post-it">
                <p>"Enjoy the process"</p>
            </div>
            <br>
            <div class="post-it">
                <p>"A smooth sea never made a skilled sailor"</p>
            </div>
            <div class="post-it">
                <p>"The successful man will profit from his mistakes and try 
                    again a different way"
                </p>
            </div>
            <div class="post-it">
                <p>"Focus on the goal not the obstacle"</p>
            </div>
        </div>
    </body>
</html>
