<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Images Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <img 
            src="images/rose-field.jpg"
            alt="rose field"
            height="500"
        >
        <img 
            src="images/sunflower-field.jpg"

            width="500"
        >
        <p>
            This is text <sup> here </sup> superscripted. Like x<sup>2</sup>
        </p>
        <p>
            This text <sub> here </sub> is subscripted.
        </p>
